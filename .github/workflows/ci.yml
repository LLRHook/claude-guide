name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Check Rust
        run: cargo clippy --offline --locked --manifest-path native/Cargo.toml -- -D warnings

      - name: Test
        run: npm test
