name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    env:
      RUSTUP_AUTO_INSTALL: '0'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Set up Python for isolated tarball checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Check Rust
        run: cargo clippy --offline --locked --manifest-path native/Cargo.toml -- -D warnings

      - name: Build native guard
        run: npm run build:native

      - name: Test real native guard, hooks, and worker isolation
        run: npm run test:native

      - name: Test packed native library and installed hooks in a synthetic home
        run: npm run test:package
